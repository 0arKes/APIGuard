services:

  postgres:
    image: postgres:17
    container_name: apiguard-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: apiguard-redis

  web:
    build: .
    container_name: apiguard-web
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: >
      sh -c "poetry run python manage.py migrate &&
            poetry run python manage.py runserver 0.0.0.0:8000"

  celery-worker:
    build: .
    container_name: apiguard-celery-worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: poetry run celery -A config worker --loglevel=info --pool=solo

  celery-beat:
    build: .
    container_name: apiguard-celery-beat
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    command: poetry run celery -A config beat --loglevel=info

volumes:
  postgres_data: