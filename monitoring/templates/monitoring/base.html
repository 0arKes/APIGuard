{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static "monitoring/styles/root.css" %}">
    {% block styles %}{% endblock styles %}
    <title>{% block title %}{% endblock title %}</title>
</head>
<body>
    {% block header %}
    {% endblock header %}

    {% block main %}
    {% endblock main %}

    {% block javascript %}
    {% endblock javascript %}

</body>
</html>
