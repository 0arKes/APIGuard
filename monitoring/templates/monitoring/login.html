{% extends "monitoring/base.html" %}
{% load static %}


{% block styles %}
    <link rel="stylesheet" href="{% static "monitoring/styles/login.css" %}">
{% endblock styles %}

{% block title %}Login{% endblock title %}

{% block main %}
    <main>
        <form method="post">
            <h1>Login</h1>
            {% csrf_token %}
            {{ form }}
            <button type="submit">Logar</button>
        </form>
    </main>
{% endblock main %}
